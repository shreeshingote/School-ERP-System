services:
  # Service 1: Node.js Express Backend
  backend:
    build: ./backend
    container_name: erp_backend
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "5001:5001"
    environment:
      MONGO_URI: mongodb+srv://shreeshingote2004_db_user:Shree1704@cluster0.qsvrwxl.mongodb.net/schoolERPDB?retryWrites=true&w=majority
      PORT: 5001
    networks:
      - erp-network

  # Service 2: React Vite Frontend
  frontend:
    build: ./frontend
    container_name: erp_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    depends_on:
      - backend
    networks:
      - erp-network

networks:
  erp-network:
    driver: bridge